<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="diagram.css" />
    <style>
      body {
        width: 1380px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      figure {
        margin: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
        border-bottom: 1px solid var(--border);
      }
      figcaption {
        padding: 13px 16px 15px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--muted-foreground);
      }
      figcaption strong {
        display: block;
        margin-bottom: 3px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12.5px;
        font-weight: 400;
        color: var(--foreground);
      }
      .footer {
        margin-top: 16px;
        font-size: 12.5px;
        color: var(--muted-foreground);
      }
    </style>
  </head>
  <body>
    <div class="fig" id="fig">
      <div class="eyebrow">Dialog</div>
      <h1>Default surface, or none at all</h1>
      <p class="lede">
        The same component, composed two ways. Before <span class="mono">variant</span>, the right
        one was a class string cancelling the left one's defaults with
        <span class="mono">!important</span>.
      </p>

      <div class="pair">
        <figure>
          <img
            src="../02-dialog-default.png"
            alt="Dialog rendered as a centred card over a dark overlay"
          />
          <figcaption>
            <strong>variant="default"</strong>
            A centred card: border, radius, padding, entrance animation, the house ghost close
            button.
          </figcaption>
        </figure>

        <figure>
          <img
            src="../02-dialog-bare.png"
            alt="Full-bleed dialog layer with a custom close button"
          />
          <figcaption>
            <strong>variant="bare"</strong>
            Full viewport, no card chrome, no animation. The consumer colours the veil and supplies
            the close affordance.
          </figcaption>
        </figure>
      </div>

      <p class="footer">
        Both captured from the Dialog stories in Storybook 10, light theme, at the same viewport.
      </p>
    </div>
  </body>
</html>
