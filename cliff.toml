[changelog]
header = """# Changelog

All notable changes to this project are documented in this file.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}{% if commit.remote.github.pr_number %} ([#{{ commit.remote.github.pr_number }}]({{ commit.remote.github.pr_url }})){% endif %}
{% endfor %}
{% endfor -%}"""
trim = true
footer = ""

[git]
conventional_commits = true
# Unconventional subjects are still worth recording; the catch-all parser below
# files them under "Other" instead of dropping them.
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chores" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI/CD" },
  { message = "^style", group = "Styling" },
  { message = "^perf", group = "Performance" },
  { message = ".*", group = "Other" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "misiekhardcore"
repo = "konopskidevui"
