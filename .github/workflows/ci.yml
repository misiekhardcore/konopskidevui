name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v2.0.0
        with:
          version: 12.11.2
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm ci --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm tsc

      - name: Unit tests
        run: pnpm test:coverage

      - name: Install the Storybook browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook tests (render, play functions, axe)
        run: pnpm test:stories

      - name: Build the library
        run: pnpm build

      - name: Check the published package
        run: pnpm verify:package

      - name: Build Storybook
        run: pnpm build:storybook
