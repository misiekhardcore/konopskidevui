name: Visual tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: visual-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Chromatic runs from a branch's own commits, so the checkout has to be the pull
# request's head rather than the merge commit GitHub builds for `pull_request`.
# The token also gates every step: a job-level `if` cannot read secrets, and a
# fork's pull request has none, so there the job is simply a no-op.
env:
  CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
  CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHROMATIC_SLUG: ${{ github.repository }}

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          # TurboSnap compares against the base commit, which needs the history.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install pnpm and Node.js
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v2.0.0
        with:
          version: 12.11.2
          runtime: node@24
          cache: true

      - name: Install dependencies
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: pnpm ci --frozen-lockfile

      - name: Run Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@v18
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build:storybook
